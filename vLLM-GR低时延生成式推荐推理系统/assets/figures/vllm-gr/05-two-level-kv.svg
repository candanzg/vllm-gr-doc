<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="'Noto Sans CJK SC','Noto Sans SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>两级 KV 组织与 GPU / NPU 同一契约</title>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7C8F"/>
    </marker>
  </defs>
  <rect width="940" height="760" fill="#ffffff"/>

  <text x="20" y="40" font-size="22" font-weight="700" fill="#1F2D3D">两级 KV 组织与 GPU / NPU 同一契约</text>
  <text x="20" y="68" font-size="12.5" fill="#5A6B7B">第一级复用 vLLM 的分页池，负责跨请求的 prompt 复用；第二级是 GR 新增的稠密后缀池，负责 beam 内部的分叉历史。</text>

  <!-- ===== Level 1 ===== -->
  <rect x="20" y="90" width="440" height="270" rx="10" fill="#F4F8FD" stroke="#6B9BD1"/>
  <text x="40" y="118" font-size="15" font-weight="700" fill="#1F4E86">第一级：prompt KV（复用 vLLM 分页池）</text>
  <text x="40" y="140" font-size="12" fill="#3A4757">粒度：16 token 一块 · 按块哈希索引 · 引用计数</text>

  <text x="40" y="172" font-size="11.5" fill="#5A6B7B">item 0</text>
  <g fill="#E8F1FB" stroke="#6B9BD1">
    <rect x="96" y="158" width="40" height="22" rx="3"/><rect x="140" y="158" width="40" height="22" rx="3"/>
    <rect x="184" y="158" width="40" height="22" rx="3"/><rect x="260" y="158" width="40" height="22" rx="3"/>
  </g>
  <text x="242" y="174" font-size="13" fill="#8A97A6" text-anchor="middle">…</text>

  <text x="40" y="206" font-size="11.5" fill="#5A6B7B">item 1</text>
  <g fill="#E8F1FB" stroke="#6B9BD1">
    <rect x="96" y="192" width="40" height="22" rx="3"/><rect x="140" y="192" width="40" height="22" rx="3"/>
    <rect x="184" y="192" width="40" height="22" rx="3"/><rect x="260" y="192" width="40" height="22" rx="3"/>
  </g>
  <text x="242" y="208" font-size="13" fill="#8A97A6" text-anchor="middle">…</text>

  <rect x="316" y="158" width="128" height="56" rx="6" fill="#ffffff" stroke="#9AA7B6" stroke-dasharray="4,3"/>
  <text x="380" y="180" font-size="11.5" fill="#3A4757" text-anchor="middle">块哈希表</text>
  <text x="380" y="198" font-size="11" fill="#5A6B7B" text-anchor="middle">相同前缀指向同一块</text>

  <text x="40" y="246" font-size="12.5" fill="#3A4757">• 每个 item 的 prompt 只存一份，W 条 beam 共读</text>
  <text x="40" y="270" font-size="12.5" fill="#3A4757">• 相同上下文再次到达时按块命中，只重算尾块</text>
  <text x="40" y="294" font-size="12.5" fill="#3A4757">• 块的分配、回收与淘汰沿用上游调度器</text>
  <text x="40" y="330" font-size="12" fill="#1F4E86" font-weight="700">GR 改动：无（直接复用）</text>

  <!-- ===== Level 2 ===== -->
  <rect x="480" y="90" width="440" height="270" rx="10" fill="#FFF8F1" stroke="#E0A060"/>
  <text x="500" y="118" font-size="15" font-weight="700" fill="#B0702C">第二级：后缀 KV（GR 新增 BeamAttentionPool）</text>
  <text x="500" y="140" font-size="12" fill="#3A4757">粒度：token · 每层 [slot, W, H_kv, S, D] · 启动时一次分配</text>

  <g font-size="11" fill="#5A6B7B">
    <text x="500" y="172">slot 0</text><text x="500" y="200">slot 1</text><text x="500" y="250">slot 7</text>
  </g>
  <g fill="#FDEBD9" stroke="#E0A060">
    <rect x="548" y="158" width="150" height="22" rx="3"/>
    <rect x="548" y="186" width="150" height="22" rx="3"/>
    <rect x="548" y="236" width="150" height="22" rx="3"/>
  </g>
  <text x="623" y="174" font-size="10.5" fill="#B0702C" text-anchor="middle">item 0 · W×S 个位置</text>
  <text x="623" y="202" font-size="10.5" fill="#B0702C" text-anchor="middle">item 1 · W×S 个位置</text>
  <text x="623" y="227" font-size="13" fill="#8A97A6" text-anchor="middle">⋮</text>
  <text x="623" y="252" font-size="10.5" fill="#8A97A6" text-anchor="middle">空闲</text>

  <rect x="714" y="158" width="190" height="100" rx="6" fill="#ffffff" stroke="#9AA7B6" stroke-dasharray="4,3"/>
  <text x="809" y="180" font-size="11.5" fill="#3A4757" text-anchor="middle">slot 由 free-list 管理</text>
  <text x="809" y="200" font-size="11" fill="#5A6B7B" text-anchor="middle">数量 = 最大 batch（8）</text>
  <text x="809" y="220" font-size="11" fill="#5A6B7B" text-anchor="middle">地址运行期不变</text>
  <text x="809" y="240" font-size="11" fill="#5A6B7B" text-anchor="middle">CUDA Graph 可直接回放</text>

  <text x="500" y="294" font-size="12.5" fill="#3A4757">• 不按块对齐，没有块内碎片</text>
  <text x="500" y="318" font-size="12.5" fill="#3A4757">• 生命周期 = 一次搜索，结束即归还 slot</text>
  <text x="500" y="342" font-size="12" fill="#B0702C" font-weight="700">GR 改动：新增池、写入 / 注意力 / 重排三个算子</text>

  <!-- ===== attention join ===== -->
  <line x1="240" y1="360" x2="420" y2="402" stroke="#6B7C8F" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="700" y1="360" x2="520" y2="402" stroke="#6B7C8F" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="404" width="340" height="50" rx="8" fill="#E6F4EC" stroke="#5FA97E"/>
  <text x="470" y="426" font-size="13.5" font-weight="700" fill="#1F7A4D" text-anchor="middle">一次 Decode attention 同时读两级</text>
  <text x="470" y="445" font-size="11.5" fill="#3A4757" text-anchor="middle">prefix 与 suffix 分别计算，再用 LSE 合并（图 5）</text>

  <!-- ===== contract table ===== -->
  <text x="20" y="496" font-size="15" font-weight="700" fill="#1F2D3D">后缀池的三类操作：同一布局，平台各自实现</text>
  <g font-size="12">
    <rect x="20" y="508" width="900" height="30" fill="#F0F3F7"/>
    <text x="36" y="528" font-weight="700" fill="#3A4757">操作</text>
    <text x="180" y="528" font-weight="700" fill="#3A4757">CUDA</text>
    <text x="570" y="528" font-weight="700" fill="#3A4757">NPU（xllm-ops 算子）</text>

    <text x="36" y="562" fill="#3A4757" font-weight="700">写入本步 K/V</text>
    <text x="180" y="562" fill="#3A4757">Triton kernel；步号从设备标量读取，可被图捕获</text>
    <text x="570" y="562" fill="#3A4757">cache_unshared_kv</text>
    <line x1="20" y1="574" x2="920" y2="574" stroke="#E3E8EE"/>

    <text x="36" y="598" fill="#3A4757" font-weight="700">两级 attention</text>
    <text x="180" y="598" fill="#3A4757">prefix FlashAttention + 后缀 attention + LSE 合并</text>
    <text x="570" y="598" fill="#3A4757">x_attention（单次融合调用）</text>
    <line x1="20" y1="610" x2="920" y2="610" stroke="#E3E8EE"/>

    <text x="36" y="634" fill="#3A4757" font-weight="700">按父索引重排</text>
    <text x="180" y="634" fill="#3A4757">全层 gather → scratch → scatter，两次 launch</text>
    <text x="570" y="634" fill="#3A4757">select_unshared_kv（原地重排）</text>
    <line x1="20" y1="646" x2="920" y2="646" stroke="#E3E8EE"/>

    <text x="36" y="670" fill="#3A4757" font-weight="700">共同契约</text>
    <text x="180" y="670" fill="#3A4757">池布局 [slot, beam, kv_head, step, head_dim]，bf16 / fp16；同一份 Torch 参考实现做数值对照</text>
  </g>

  <text x="20" y="712" font-size="11.5" fill="#5A6B7B">后缀池布局与 NPU 算子签名对齐 xllm-ops；共享前缀与私有后缀分离计算的思路参考了 Hydragen 与 xGR。</text>
  <text x="20" y="732" font-size="11.5" fill="#5A6B7B">逻辑示意，不按显存比例绘制。代码基线：vLLM-GR decode_graph 分支 7461a48。</text>
</svg>
