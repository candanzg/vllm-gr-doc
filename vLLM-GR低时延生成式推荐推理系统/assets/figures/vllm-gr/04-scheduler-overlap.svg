<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
<title id="title">两槽流水：提前 CPU 准备，保持 GPU 数据依赖</title>
<desc id="desc">示意图，不按实测时间比例绘制；两条路径的设备阶段使用相同示意宽度。</desc>
<style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif}</style>
<rect x="0" y="0" width="1440" height="930" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="40" y="62.0" fill="#24364B" font-size="34" font-weight="700" text-anchor="start">两槽流水：提前 CPU 准备，保持 GPU 数据依赖</text>
<text x="40" y="104.0" fill="#60768D" font-size="21" font-weight="400" text-anchor="start">示意图，不按实测时间比例绘制；两条路径的设备阶段使用相同示意宽度。</text>
<text x="40" y="174.0" fill="#24364B" font-size="27" font-weight="700" text-anchor="start">串行：消费上一阶段回执后，再准备下一阶段</text>
<text x="40" y="247.0" fill="#24364B" font-size="23" font-weight="700" text-anchor="start">Worker CPU</text>
<text x="40" y="333.0" fill="#24364B" font-size="23" font-weight="700" text-anchor="start">GPU compute</text>
<rect x="240" y="220" width="120" height="57" rx="12" fill="#E3F1FB" stroke="#8AB8D5" stroke-width="1.5"/>
<text x="300" y="253.0" fill="#24364B" font-size="22" font-weight="400" text-anchor="middle">提交 P</text>
<rect x="360" y="220" width="480" height="57" rx="12" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="1.5"/>
<text x="600" y="253.0" fill="#60768D" font-size="22" font-weight="400" text-anchor="middle">等待 P 的完成回执</text>
<rect x="840" y="220" width="200" height="57" rx="12" fill="#FFF6D6" stroke="#DFBF65" stroke-width="1.5"/>
<text x="940" y="253.0" fill="#24364B" font-size="22" font-weight="400" text-anchor="middle">准备 D1</text>
<rect x="1040" y="220" width="60" height="57" rx="12" fill="#E3F1FB" stroke="#8AB8D5" stroke-width="1.5"/>
<text x="1070" y="251.0" fill="#24364B" font-size="18" font-weight="400" text-anchor="middle">提交</text>
<rect x="360" y="306" width="480" height="65" rx="12" fill="#F8DDE4" stroke="#D493A5" stroke-width="1.5"/>
<text x="600" y="347.0" fill="#24364B" font-size="23" font-weight="400" text-anchor="middle">Prefill + 首次 Beam 更新</text>
<rect x="840" y="306" width="260" height="65" rx="12" fill="#EEF2F6" stroke="#EEF2F6" stroke-width="1.5"/>
<text x="970" y="346.0" fill="#60768D" font-size="20" font-weight="400" text-anchor="middle">准备引入的间隙</text>
<rect x="1100" y="306" width="240" height="65" rx="12" fill="#E0F2EA" stroke="#77B79E" stroke-width="1.5"/>
<text x="1220" y="347.0" fill="#24364B" font-size="23" font-weight="400" text-anchor="middle">Decode 1</text>
<polyline points="840,306 840,284" fill="none" stroke="#60768D" stroke-width="2"/>
<polygon points="840.0,284.0 845.5,294.6 834.5,294.6" fill="#60768D"/>
<polyline points="240,412 1360,412" fill="none" stroke="#60768D" stroke-width="2"/>
<polygon points="1360.0,412.0 1349.4,417.5 1349.4,406.5" fill="#60768D"/>
<text x="1360" y="440.0" fill="#60768D" font-size="20" font-weight="400" text-anchor="end">时间 →</text>
<text x="40" y="516.0" fill="#24364B" font-size="27" font-weight="700" text-anchor="start">异步：P 已提交采样后，第二个槽接纳 D1</text>
<text x="40" y="589.0" fill="#24364B" font-size="23" font-weight="700" text-anchor="start">Worker CPU</text>
<text x="40" y="675.0" fill="#24364B" font-size="23" font-weight="700" text-anchor="start">GPU compute</text>
<rect x="240" y="562" width="120" height="57" rx="12" fill="#E3F1FB" stroke="#8AB8D5" stroke-width="1.5"/>
<text x="300" y="595.0" fill="#24364B" font-size="22" font-weight="400" text-anchor="middle">提交 P</text>
<rect x="360" y="562" width="200" height="57" rx="12" fill="#FFF6D6" stroke="#DFBF65" stroke-width="1.5"/>
<text x="460" y="595.0" fill="#24364B" font-size="22" font-weight="400" text-anchor="middle">准备 D1</text>
<rect x="560" y="562" width="60" height="57" rx="12" fill="#E3F1FB" stroke="#8AB8D5" stroke-width="1.5"/>
<text x="590" y="593.0" fill="#24364B" font-size="18" font-weight="400" text-anchor="middle">提交</text>
<text x="680" y="596.0" fill="#60768D" font-size="21" font-weight="400" text-anchor="start">随后消费回执，释放在途槽</text>
<rect x="360" y="648" width="480" height="65" rx="12" fill="#F8DDE4" stroke="#D493A5" stroke-width="1.5"/>
<text x="600" y="689.0" fill="#24364B" font-size="23" font-weight="400" text-anchor="middle">Prefill + 首次 Beam 更新</text>
<rect x="840" y="648" width="240" height="65" rx="12" fill="#E0F2EA" stroke="#77B79E" stroke-width="1.5"/>
<text x="960" y="689.0" fill="#24364B" font-size="23" font-weight="400" text-anchor="middle">Decode 1</text>
<polyline points="620,619 620,635 840,635 840,648" fill="none" stroke="#357E64" stroke-width="2" stroke-dasharray="7 6"/>
<polygon points="840.0,648.0 834.5,637.4 845.5,637.4" fill="#357E64"/>
<polyline points="240,753 1360,753" fill="none" stroke="#60768D" stroke-width="2"/>
<polygon points="1360.0,753.0 1349.4,758.5 1349.4,747.5" fill="#60768D"/>
<text x="1360" y="781.0" fill="#60768D" font-size="20" font-weight="400" text-anchor="end">时间 →</text>
<rect x="40" y="817" width="1360" height="74" rx="12" fill="#FFF6D6" stroke="#DFBF65" stroke-width="1.5"/>
<text x="64" y="858.0" fill="#24364B" font-size="24" font-weight="400" text-anchor="start">主机准备只依赖已知几何；真实 token / Beam 状态绑定在设备流中排在 P 的采样之后。</text>
</svg>
